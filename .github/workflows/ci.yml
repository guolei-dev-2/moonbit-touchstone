name: verify
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start source receipt
        run: |
          mkdir -p _build/ci
          git rev-parse HEAD > _build/ci/commit.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install pinned MoonBit from official installer
        shell: bash
        env:
          MOON_HOME: ${{ runner.temp }}/moonbit
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://cli.moonbitlang.com/install/unix.sh --output "$RUNNER_TEMP/install-moonbit.sh"
          printf '%s  %s\n' '46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe' \
            "$RUNNER_TEMP/install-moonbit.sh" | sha256sum --check --strict -
          bash "$RUNNER_TEMP/install-moonbit.sh" "$(cat .moonbit-version)"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Record and verify actual compiler and source identity
        run: python tools/ci-identity.py --output _build/ci/identity.json
      - run: moon fmt --check
      - run: moon check --target all --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon test --target wasm-gc --deny-warn
      - run: moon build --target js --release --deny-warn
      - name: Check generated public interfaces
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - run: node tools/check-cli.mjs
      - name: Install and record independent reference versions
        run: |
          python -m pip install --requirement tools/requirements.txt
          python -m pip freeze > _build/ci/python-dependencies.txt
      - run: python tools/verify-reference.py --evidence _build/ci/reference.json
      - run: python tools/verify-rf.py --evidence _build/ci/rf.json
      - run: python tools/verify-bands.py --evidence _build/ci/bands.json
      - run: python tools/verify-ripple.py --evidence _build/ci/ripple.json
      - run: python tools/verify-one-port-consumer.py --evidence _build/ci/one-port.json
      - name: Consume synthesized matching networks on JS and Wasm-GC
        run: |
          moon run examples/shunt_stub_match --target js --release > _build/ci/stub-js.json
          moon run examples/shunt_stub_match --target wasm-gc --release > _build/ci/stub-wasm-gc.json
          python dev/verify_shunt_stub.py --input _build/ci/stub-js.json \
            --input _build/ci/stub-wasm-gc.json --output _build/ci/stub-independent.json
      - run: moon run examples/band_check --target js
      - run: moon run examples/band_check --target wasm-gc
      - run: moon run examples/rf_03 --target js
      - run: moon run examples/rf_03 --target wasm-gc
      - name: Package the module
        run: moon package --frozen
      - name: Verify tracked sources stayed unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: _build/ci/
          if-no-files-found: error
          retention-days: 7
